name: zeecv
description: "A professional resume maker app"
publish_to: 'none'
version: 2.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.0.5
  http: ^1.1.0
  shared_preferences: ^2.5.0
  go_router: ^13.0.1
  flutter_app_config: ^1.0.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.4.2
  dio: ^5.4.0
  google_sign_in: ^6.2.1
  flutter_html: ^3.0.0-alpha.6
  flutter_inappwebview: ^6.1.5
  firebase_core: ^3.15.0
  permission_handler: ^11.0.1
  path_provider: ^2.1.0
  open_file: ^3.3.2    
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/icon/edit.png
    - assets/icon/icon.png
    - assets/images/google_logo.png
    - assets/certs/root_ca.pem

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#ffffff"

flutter_app_config:
  app_name: "ZeeCV"
  package_id: "com.zeecv"
  custom_icon_path: "assets/icon/icon.png"