name: zeecv
description: "A professional resume maker app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.0.5
  
  # API & Storage
  http: ^1.1.0
  shared_preferences: ^2.5.0
  
  # Navigation
  go_router: ^13.0.1
  flutter_app_config: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1 

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#ffffff"
  # adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  
  assets:
    - assets/icon/
flutter_app_config:
  app_name: "ZeeCV"
  package_id: "com.example.zeecv"  # Your package ID
  custom_icon_path: "assets/icon/icon.png"